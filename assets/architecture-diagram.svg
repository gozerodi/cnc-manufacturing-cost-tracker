<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cnc-arch-title cnc-arch-desc">
      <title id="cnc-arch-title">CNC Cost Tracker — Architecture</title>
      <desc id="cnc-arch-desc">Architecture diagram of the CNC Manufacturing Cost Tracker: a PySide6 UI layer calls into business-logic Services, which use Repositories to reach SQLAlchemy Models backed by PostgreSQL. Alembic migrates the PostgreSQL schema directly. A cross-cutting Core module — config, DB session, auth, error handling, time parsing — supports the UI, Services, and Repositories layers.</desc>

      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="cnc-arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="cnc-arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first (behind boxes) -->

      <!-- Main chain: UI -> Services -> Repositories -> Models -> PostgreSQL (straight verticals, shared x=184) -->
      <line x1="184" y1="128" x2="184" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cnc-arch-arrow)"/>
      <line x1="184" y1="216" x2="184" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cnc-arch-arrow)"/>
      <line x1="184" y1="304" x2="184" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cnc-arch-arrow)"/>
      <line x1="184" y1="392" x2="184" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cnc-arch-arrow)"/>

      <!-- Alembic -> PostgreSQL (straight horizontal, shared y=448) -->
      <line x1="400" y1="448" x2="304" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cnc-arch-arrow)"/>

      <!-- Core (support) -> UI / Services / Repositories — dashed, cross-cutting, straight horizontals at shared y -->
      <line x1="680" y1="96"  x2="304" y2="96"  stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#cnc-arch-arrow)"/>
      <line x1="680" y1="184" x2="304" y2="184" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#cnc-arch-arrow)"/>
      <line x1="680" y1="272" x2="304" y2="272" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#cnc-arch-arrow)"/>

      <!-- Node: UI Layer (component) -->
      <rect x="64" y="64" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="64" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="72" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="85" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="184" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UI Layer</text>
      <text x="184" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">login · main · pages · widgets</text>

      <!-- Node: Services (focal) -->
      <rect x="64" y="152" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="152" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="72" y="160" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="88" y="169" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="184" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Services</text>
      <text x="184" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cost · planning · production +3</text>

      <!-- Node: Repositories (component) -->
      <rect x="64" y="240" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="240" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="248" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="90" y="257" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="184" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repositories</text>
      <text x="184" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10 repositories · plain CRUD</text>

      <!-- Node: Models (component) -->
      <rect x="64" y="328" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="328" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="336" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="88" y="345" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORM</text>
      <text x="184" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Models</text>

      <!-- Node: PostgreSQL (focal store) -->
      <rect x="64" y="416" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="416" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="72" y="424" width="26" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="85" y="433" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="184" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>

      <!-- Node: Alembic (component) -->
      <rect x="400" y="416" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="416" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="424" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="423" y="433" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPS</text>
      <text x="490" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alembic</text>

      <!-- Node: Core (support, spans UI -> Repositories) -->
      <rect x="680" y="64" width="200" height="240" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="64" width="200" height="240" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="688" y="72" width="38" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="707" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="780" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Core</text>
      <text x="780" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config · session · auth +2</text>

      <!-- Legend strip -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="572" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="580" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Layer / component</text>

      <rect x="204" y="572" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="224" y="580" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal component</text>

      <rect x="360" y="572" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="380" y="580" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cross-cutting support</text>

      <line x1="576" y1="577" x2="604" y2="577" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cnc-arch-arrow)"/>
      <text x="612" y="580" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Calls into</text>

      <line x1="740" y1="577" x2="768" y2="577" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#cnc-arch-arrow)"/>
      <text x="776" y="580" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Supports</text>
    </svg>
